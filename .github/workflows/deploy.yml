name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: ghcr.io/juliomarte/quisqueyatech.com

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://www.quisqueyatech.com
      NEXT_PUBLIC_CONTACT_EMAIL: info@quisqueyatech.com
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  deploy-convex:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy Convex production backend
        run: npm run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  build-and-push:
    needs: [validate, deploy-convex]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.quisqueyatech.com
            NEXT_PUBLIC_CONTACT_EMAIL=info@quisqueyatech.com
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  deploy-coolify:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Trigger Coolify pull + restart
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          echo "Requesting Coolify deploy (image pull only if app is Docker Image source)"
          if [ -n "${COOLIFY_TOKEN:-}" ]; then
            curl --fail --show-error --silent --request GET \
              "$COOLIFY_WEBHOOK_URL" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"
          else
            curl --fail --show-error --silent --request GET \
              "$COOLIFY_WEBHOOK_URL"
          fi
          echo
          echo "Coolify webhook accepted."

      - name: Skip Coolify when webhook is not configured
        if: ${{ env.COOLIFY_WEBHOOK_URL == '' }}
        run: |
          echo "COOLIFY_WEBHOOK_URL is not set. Image was pushed to GHCR;"
          echo "configure Coolify to pull ${{ env.IMAGE_NAME }}:latest and add the deploy webhook secret."
