name: CI

# PR validation only. Production image build + Coolify pull lives in deploy.yml.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://www.quisqueyatech.com
      NEXT_PUBLIC_CONTACT_EMAIL: info@quisqueyatech.com
      NEXT_PUBLIC_CONTACT_PHONE_DISPLAY: "+1 (829) 445-8366"
      NEXT_PUBLIC_CONTACT_PHONE_E164: "+18294458366"
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Emit formatted hero
        run: |
          npx prettier --write components/sections/business-impact-hero.tsx
          echo "FORMATTED_HERO_BASE64_BEGIN"
          base64 -w0 components/sections/business-impact-hero.tsx
          echo
          echo "FORMATTED_HERO_BASE64_END"
          exit 1
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
