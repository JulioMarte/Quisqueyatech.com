name: Astro static site

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test SQLite schema and search
        run: npm run test:sqlite
      - name: Smoke test file-backed SQLite migrations
        env:
          SQLITE_DATABASE_PATH: /tmp/quisqueyatech-ci.sqlite
        run: npm run db:migrate
      - name: Migrate Better Auth on shared SQLite database
        env:
          SQLITE_DATABASE_PATH: /tmp/quisqueyatech-ci.sqlite
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
          BETTER_AUTH_URL: http://127.0.0.1:8787
          AUTH_TRUSTED_ORIGINS: http://127.0.0.1:8787
        run: |
          npm run db:migrate:auth
          node - <<'NODE'
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync('/tmp/quisqueyatech-ci.sqlite');
          const names = new Set(db.prepare("SELECT name FROM sqlite_master WHERE type='table'").all().map((row) => String(row.name)));
          for (const table of ['user', 'session', 'account', 'verification']) {
            if (!names.has(table)) throw new Error(`Missing Better Auth table: ${table}`);
          }
          db.close();
          NODE
      - name: Type-check Astro and React
        run: npm run check
      - name: Build static site
        env:
          PUBLIC_SITE_URL: https://preview.quisqueyatech.com
          PUBLIC_CONTACT_EMAIL: info@quisqueyatech.com
          PUBLIC_LIVEKIT_ASSESSMENT_URL: ${{ secrets.PUBLIC_LIVEKIT_ASSESSMENT_URL }}
          PUBLIC_ASSESSMENT_SCHEDULE_URL: ${{ secrets.PUBLIC_ASSESSMENT_SCHEDULE_URL }}
        run: npm run build
      - name: Verify static artifact
        run: |
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/brand/logo-mark.png
          if find dist -type f \( -name 'server.js' -o -name '*.php' \) | grep -q .; then
            echo 'Unexpected server runtime artifact found'
            exit 1
          fi
      - name: Build deployment image
        run: |
          docker build \
            --build-arg PUBLIC_SITE_URL=https://preview.quisqueyatech.com \
            -t quisqueyatech-preview:test .
      - name: Smoke test Nginx on ports 80 and 3000
        run: |
          docker run -d --name quisqueyatech-preview -p 18080:80 -p 13000:3000 quisqueyatech-preview:test
          trap 'docker logs quisqueyatech-preview || true; docker rm -f quisqueyatech-preview || true' EXIT

          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --show-error --silent http://127.0.0.1:18080/healthz
          curl --fail --show-error --silent http://127.0.0.1:13000/healthz
          curl --fail --show-error --silent http://127.0.0.1:18080/ | grep -qi '<!doctype html>'
          curl --fail --show-error --silent http://127.0.0.1:13000/en | grep -qi '<!doctype html>'
      - name: Build SQLite runtime image
        run: docker build -f Dockerfile.runtime -t quisqueyatech-runtime:test .
      - name: Smoke test SQLite runtime image and persistent volume
        run: |
          docker volume create quisqueyatech-runtime-ci >/dev/null
          cleanup() {
            docker logs quisqueyatech-runtime-ci-api || true
            docker rm -f quisqueyatech-runtime-ci-api >/dev/null 2>&1 || true
            docker volume rm quisqueyatech-runtime-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm \
            -v quisqueyatech-runtime-ci:/data \
            -e SQLITE_DATABASE_PATH=/data/quisqueyatech.sqlite \
            quisqueyatech-runtime:test npm run db:migrate

          docker run --rm \
            -v quisqueyatech-runtime-ci:/data \
            -e SQLITE_DATABASE_PATH=/data/quisqueyatech.sqlite \
            -e BETTER_AUTH_SECRET=ci-only-better-auth-secret-0123456789abcdef \
            -e BETTER_AUTH_URL=http://127.0.0.1:8787 \
            -e AUTH_TRUSTED_ORIGINS=http://127.0.0.1:8787 \
            quisqueyatech-runtime:test npm run db:migrate:auth

          docker run -d --name quisqueyatech-runtime-ci-api \
            -p 18787:8787 \
            -v quisqueyatech-runtime-ci:/data \
            -e SQLITE_DATABASE_PATH=/data/quisqueyatech.sqlite \
            -e BETTER_AUTH_SECRET=ci-only-better-auth-secret-0123456789abcdef \
            -e BETTER_AUTH_URL=http://127.0.0.1:18787 \
            -e AUTH_TRUSTED_ORIGINS=http://127.0.0.1:18787 \
            -e ADMIN_API_SECRET=ci-only-admin-api-secret-0123456789abcdef \
            quisqueyatech-runtime:test

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --show-error --silent http://127.0.0.1:18787/healthz | grep -q '"database":"sqlite"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18787/machine/runtime)" = "401"
