name: Format marketing refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-marketing-refactor
  cancel-in-progress: false

jobs:
  format:
    if: github.head_ref == 'refactor/marketing-site-visual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format marketing SEO refactor"
          git push origin HEAD:${{ github.head_ref }}
