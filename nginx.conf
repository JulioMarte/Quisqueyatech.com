server {
  listen 80 default_server;
  listen 3000 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Astro generates directory-based static routes such as /en/index.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Cache immutable/static assets aggressively.
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Explicit health endpoint for Coolify/container checks.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
